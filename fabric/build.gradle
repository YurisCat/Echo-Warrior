plugins {
	id 'multiloader-loader'
	id 'net.fabricmc.fabric-loom'
}

dependencies {
	minecraft("com.mojang:minecraft:${minecraft_version}")
	implementation("net.fabricmc:fabric-loader:${loader_version}")
	implementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")
	implementation("net.tslat:smartbrainlib-fabric-${minecraft_version}:${smartbrainlib_version}")
	implementation("com.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}")
}

loom {
	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}

	runs {
		client {
			client()
			setConfigName('Echo Warrior Fabric Client')
			runDir(rootProject.file('run').absolutePath)
			programArg '--username=EchoWarriorDev'

			def quickPlayWorld = providers.gradleProperty('quickPlayWorld').orNull
			if (quickPlayWorld) {
				programArg '--quickPlaySingleplayer'
				programArg quickPlayWorld
			}
		}
		server {
			server()
			setConfigName('Echo Warrior Fabric Server')
			runDir(rootProject.file('run-server').absolutePath)
		}
	}
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
	configurations.named(variant) {
		attributes.attribute(loaderAttribute, 'fabric')
	}
}
sourceSets.configureEach {
	[compileClasspathConfigurationName, runtimeClasspathConfigurationName].each { variant ->
		configurations.named(variant) {
			attributes.attribute(loaderAttribute, 'fabric')
		}
	}
}
