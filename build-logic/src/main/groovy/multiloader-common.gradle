plugins {
	id 'java-library'
	id 'maven-publish'
}

base {
	archivesName = "${archives_base_name}-${project.name}-${minecraft_version}"
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = java_version as int
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
	from(rootProject.file('LICENSE')) {
		into 'META-INF'
		rename { 'LICENSE_ECHO_WARRIOR' }
	}
	from(rootProject.file('LICENSE-CODE')) {
		into 'META-INF'
		rename { 'LICENSE-CODE_ECHO_WARRIOR' }
	}
	from(rootProject.file('LICENSE-ASSETS.md')) {
		into 'META-INF'
		rename { 'LICENSE-ASSETS_ECHO_WARRIOR.md' }
	}
	from(rootProject.file('NOTICE')) {
		into 'META-INF'
		rename { 'NOTICE_ECHO_WARRIOR' }
	}
	from(rootProject.file('CREDITS.md')) {
		into 'META-INF'
		rename { 'CREDITS_ECHO_WARRIOR.md' }
	}

	manifest {
		attributes(
			'Specification-Title': mod_name,
			'Specification-Vendor': mod_author,
			'Specification-Version': project.version,
			'Implementation-Title': project.name,
			'Implementation-Version': project.version,
			'Implementation-Vendor': mod_author,
			'Built-On-Minecraft': minecraft_version
		)
	}
}

processResources {
	filteringCharset = 'UTF-8'
	def expandProps = [
		version: project.version,
		minecraft_version: minecraft_version,
		minecraft_version_range: minecraft_version_range,
		fabric_api_version: fabric_api_version,
		loader_version: loader_version,
		mod_id: mod_id,
		mod_name: mod_name,
		mod_author: mod_author,
		mod_credits: mod_credits,
		mod_description: mod_description,
		neoforge_version: neoforge_version,
		neoforge_loader_version_range: neoforge_loader_version_range,
		java_version: java_version,
		smartbrainlib_version: smartbrainlib_version,
		geckolib_version: geckolib_version
	]
	def jsonExpandProps = expandProps.collectEntries { key, value ->
		[(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
	}

	filesMatching(['META-INF/neoforge.mods.toml']) {
		expand expandProps
	}
	filesMatching(['fabric.mod.json', '*.mixins.json', 'pack.mcmeta']) {
		expand jsonExpandProps
	}
	inputs.properties(expandProps)
}

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java
		}
	}
}
