name: Check Modrinth configuration

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/modrinth-release.py
      - scripts/test_modrinth_release.py
      - .github/workflows/check-modrinth.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test release guards without network or uploads
        run: |
          python3 scripts/test_curseforge_release.py
          python3 scripts/test_modrinth_release.py
          python3 scripts/check-localization.py --release-gate
      - name: Verify the stored Modrinth token with read-only API calls
        env:
          MODRINTH_API_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
        run: python3 scripts/modrinth-release.py check-token
