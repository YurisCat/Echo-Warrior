name: Publish CurseForge

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: CurseForge release channel
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      manual_release:
        description: Hold all four approved files for a later manual release
        required: true
        default: false
        type: boolean
      publish:
        description: Actually upload all four files to CurseForge (leave off for a dry run)
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish the four-version matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21 for Minecraft 1.21.1
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build the Minecraft 1.21.1 release JARs
        run: |
          chmod +x ./gradlew
          ./gradlew -p versions/1.21.1 clean dualBuild --no-daemon --stacktrace

      - name: Set up Java 25 for Minecraft 26.1.2
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build the Minecraft 26.1.2 release JARs
        run: |
          ./gradlew clean dualBuild --no-daemon --stacktrace

      - name: Prepare and validate all four CurseForge uploads
        id: release
        env:
          RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || 'release' }}
          MANUAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_release || false }}
          EXPECTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 scripts/prepare-curseforge-release.py \
            --release-type "$RELEASE_TYPE" \
            --manual-release "$MANUAL_RELEASE" \
            --expected-tag "$EXPECTED_TAG" \
            --require-jars \
            --github-output "$GITHUB_OUTPUT"

      - name: Keep all verified JARs and metadata as a GitHub artifact
        uses: actions/upload-artifact@v7
        with:
          name: echo-warrior-${{ steps.release.outputs.version }}-four-version-matrix
          path: |
            ${{ steps.release.outputs.main_fabric_jar_path }}
            ${{ steps.release.outputs.main_neoforge_jar_path }}
            ${{ steps.release.outputs.compat_1211_fabric_jar_path }}
            ${{ steps.release.outputs.compat_1211_neoforge_jar_path }}
            ${{ steps.release.outputs.main_fabric_metadata_path }}
            ${{ steps.release.outputs.main_neoforge_metadata_path }}
            ${{ steps.release.outputs.compat_1211_fabric_metadata_path }}
            ${{ steps.release.outputs.compat_1211_neoforge_metadata_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload all four files to CurseForge
        id: curseforge
        if: github.event_name == 'push' || inputs.publish
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: "1677436"
          MAIN_FABRIC_JAR_PATH: ${{ steps.release.outputs.main_fabric_jar_path }}
          MAIN_FABRIC_METADATA_PATH: ${{ steps.release.outputs.main_fabric_metadata_path }}
          MAIN_NEOFORGE_JAR_PATH: ${{ steps.release.outputs.main_neoforge_jar_path }}
          MAIN_NEOFORGE_METADATA_PATH: ${{ steps.release.outputs.main_neoforge_metadata_path }}
          COMPAT_FABRIC_JAR_PATH: ${{ steps.release.outputs.compat_1211_fabric_jar_path }}
          COMPAT_FABRIC_METADATA_PATH: ${{ steps.release.outputs.compat_1211_fabric_metadata_path }}
          COMPAT_NEOFORGE_JAR_PATH: ${{ steps.release.outputs.compat_1211_neoforge_jar_path }}
          COMPAT_NEOFORGE_METADATA_PATH: ${{ steps.release.outputs.compat_1211_neoforge_metadata_path }}
        run: |
          if [ -z "${CURSEFORGE_API_TOKEN:-}" ]; then
            echo "::error::Missing repository secret CURSEFORGE_API_TOKEN."
            exit 1
          fi

          upload_file() {
            target="$1"
            jar_path="$2"
            metadata_path="$3"
            response_file="$4"
            metadata_json="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1], encoding="utf-8")), ensure_ascii=False, separators=(",", ":")))' "$metadata_path")"
            http_status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "X-Api-Token: $CURSEFORGE_API_TOKEN" \
              --form-string "metadata=$metadata_json" \
              --form "file=@$jar_path;type=application/java-archive" \
              "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file")"

            if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
              echo "::error::$target CurseForge upload failed with HTTP $http_status."
              cat "$response_file"
              return 1
            fi
          }

          main_fabric_response="$(mktemp)"
          main_neoforge_response="$(mktemp)"
          compat_fabric_response="$(mktemp)"
          compat_neoforge_response="$(mktemp)"

          upload_file "Fabric 26.1.2" "$MAIN_FABRIC_JAR_PATH" "$MAIN_FABRIC_METADATA_PATH" "$main_fabric_response"
          upload_file "NeoForge 26.1.2" "$MAIN_NEOFORGE_JAR_PATH" "$MAIN_NEOFORGE_METADATA_PATH" "$main_neoforge_response"
          upload_file "Fabric 1.21.1" "$COMPAT_FABRIC_JAR_PATH" "$COMPAT_FABRIC_METADATA_PATH" "$compat_fabric_response"
          upload_file "NeoForge 1.21.1" "$COMPAT_NEOFORGE_JAR_PATH" "$COMPAT_NEOFORGE_METADATA_PATH" "$compat_neoforge_response"

          main_fabric_file_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' "$main_fabric_response")"
          main_neoforge_file_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' "$main_neoforge_response")"
          compat_fabric_file_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' "$compat_fabric_response")"
          compat_neoforge_file_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' "$compat_neoforge_response")"

          echo "main_fabric_file_id=$main_fabric_file_id" >> "$GITHUB_OUTPUT"
          echo "main_neoforge_file_id=$main_neoforge_file_id" >> "$GITHUB_OUTPUT"
          echo "compat_fabric_file_id=$compat_fabric_file_id" >> "$GITHUB_OUTPUT"
          echo "compat_neoforge_file_id=$compat_neoforge_file_id" >> "$GITHUB_OUTPUT"
          echo "Uploaded CurseForge file IDs $main_fabric_file_id, $main_neoforge_file_id, $compat_fabric_file_id, and $compat_neoforge_file_id."

      - name: Write release summary
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MAIN_FABRIC_JAR_NAME: ${{ steps.release.outputs.main_fabric_jar_name }}
          MAIN_NEOFORGE_JAR_NAME: ${{ steps.release.outputs.main_neoforge_jar_name }}
          COMPAT_FABRIC_JAR_NAME: ${{ steps.release.outputs.compat_1211_fabric_jar_name }}
          COMPAT_NEOFORGE_JAR_NAME: ${{ steps.release.outputs.compat_1211_neoforge_jar_name }}
          MAIN_FABRIC_FILE_ID: ${{ steps.curseforge.outputs.main_fabric_file_id }}
          MAIN_NEOFORGE_FILE_ID: ${{ steps.curseforge.outputs.main_neoforge_file_id }}
          COMPAT_FABRIC_FILE_ID: ${{ steps.curseforge.outputs.compat_fabric_file_id }}
          COMPAT_NEOFORGE_FILE_ID: ${{ steps.curseforge.outputs.compat_neoforge_file_id }}
        run: |
          echo "## Echo Warrior $VERSION four-version release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified: \`$MAIN_FABRIC_JAR_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified: \`$MAIN_NEOFORGE_JAR_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified: \`$COMPAT_FABRIC_JAR_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified: \`$COMPAT_NEOFORGE_JAR_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${MAIN_FABRIC_FILE_ID:-}" ] && [ -n "${MAIN_NEOFORGE_FILE_ID:-}" ] && [ -n "${COMPAT_FABRIC_FILE_ID:-}" ] && [ -n "${COMPAT_NEOFORGE_FILE_ID:-}" ]; then
            echo "- CurseForge uploads succeeded: \`$MAIN_FABRIC_FILE_ID\`, \`$MAIN_NEOFORGE_FILE_ID\`, \`$COMPAT_FABRIC_FILE_ID\`, \`$COMPAT_NEOFORGE_FILE_ID\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Dry run only: nothing was uploaded to CurseForge." >> "$GITHUB_STEP_SUMMARY"
          fi
