name: Publish CurseForge

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: CurseForge release channel
        required: true
        default: release
        type: choice
        options: [release, beta, alpha]
      manual_release:
        description: Hold all six approved files for a later manual release
        required: true
        default: false
        type: boolean
      publish:
        description: Actually upload all six files (leave off for a dry run)
        required: true
        default: false
        type: boolean
      allow_pending_localization:
        description: Explicit author waiver for this release's pending translations
        required: true
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish the six-file matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Java 17 toolchain for Minecraft 1.20.1
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Java 21 for legacy builds and Minecraft 1.21.1
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and audit Minecraft 1.20.1 Fabric and Forge
        run: |
          chmod +x ./gradlew
          ./gradlew -p versions/1.20.1 clean dualBuild --no-daemon --stacktrace
          python3 scripts/check-1.20.1-baseline.py
          python3 scripts/test_compatibility_1201_baseline.py
          python3 scripts/check-1.20.1-content-parity.py

      - name: Build Minecraft 1.21.1 Fabric and NeoForge
        run: ./gradlew -p versions/1.21.1 clean dualBuild --no-daemon --stacktrace

      - name: Audit Minecraft 1.21.1
        shell: pwsh
        run: ./scripts/check-1.21.1-baseline.ps1 -SkipBuild

      - name: Set up Java 25 for Minecraft 26.1.2
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build Minecraft 26.1.2 Fabric and NeoForge
        run: ./gradlew clean dualBuild --no-daemon --stacktrace

      - name: Prepare and validate all six CurseForge uploads
        id: release
        env:
          RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || 'release' }}
          MANUAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_release || false }}
          ALLOW_PENDING_LOCALIZATION: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_pending_localization || false }}
          EXPECTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 scripts/test_curseforge_release.py
          localization_args=()
          if [ "$ALLOW_PENDING_LOCALIZATION" = "true" ]; then
            localization_args+=(--allow-pending-localization)
          fi
          python3 scripts/prepare-curseforge-release.py \
            --release-type "$RELEASE_TYPE" --manual-release "$MANUAL_RELEASE" \
            --expected-tag "$EXPECTED_TAG" --require-jars \
            "${localization_args[@]}" --github-output "$GITHUB_OUTPUT"

      - name: Archive verified JARs and metadata
        uses: actions/upload-artifact@v7
        with:
          name: echo-warrior-${{ steps.release.outputs.version }}-six-file-matrix
          path: |
            ${{ steps.release.outputs.main_fabric_jar_path }}
            ${{ steps.release.outputs.main_neoforge_jar_path }}
            ${{ steps.release.outputs.compat_1211_fabric_jar_path }}
            ${{ steps.release.outputs.compat_1211_neoforge_jar_path }}
            ${{ steps.release.outputs.compat_1201_fabric_jar_path }}
            ${{ steps.release.outputs.compat_1201_forge_jar_path }}
            build/curseforge/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload each verified file once and record its ID immediately
        if: github.event_name == 'push' || inputs.publish
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          if [ -z "${CURSEFORGE_API_TOKEN:-}" ]; then
            echo "::error::Missing repository secret CURSEFORGE_API_TOKEN."
            exit 1
          fi
          mkdir -p build/curseforge/responses
          echo "## Echo Warrior uploads (verify all six before merging)" >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json; m=json.load(open("build/curseforge/release-manifest.json")); [print(a["target"], a["jar_path"], a["metadata_path"], a["sha256"], sep="\t") for a in m["artifacts"]]' > build/curseforge/uploads.tsv
          while IFS=$'\t' read -r target jar_path metadata_path expected_sha; do
            actual_sha="$(sha256sum "$jar_path" | cut -d ' ' -f 1)"
            test "$actual_sha" = "$expected_sha"
            response_file="build/curseforge/responses/$target.json"
            metadata_json="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(",", ":")))' "$metadata_path")"
            # No automatic POST retry: a timeout can occur after CF has accepted a file.
            http_status="$(curl --silent --show-error --connect-timeout 30 --max-time 300 \
              --output "$response_file" --write-out "%{http_code}" --request POST \
              --header "X-Api-Token: $CURSEFORGE_API_TOKEN" \
              --form-string "metadata=$metadata_json" \
              --form "file=@$jar_path;type=application/java-archive" \
              "https://minecraft.curseforge.com/api/projects/1677436/upload-file")"
            if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
              echo "::error::$target upload returned HTTP $http_status. Check existing files before retrying."
              cat "$response_file"
              exit 1
            fi
            file_id="$(python3 -c 'import json,sys; n=json.load(open(sys.argv[1]))["id"]; assert isinstance(n,int) and n>0; print(n)' "$response_file")"
            echo "Uploaded $target: $file_id"
            echo "- $target: https://www.curseforge.com/minecraft/mc-mods/echo-warrior/files/$file_id" >> "$GITHUB_STEP_SUMMARY"
          done < build/curseforge/uploads.tsv
          echo "All six uploads accepted by CurseForge." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve upload responses even after a partial failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: curseforge-upload-responses-${{ github.run_id }}
          path: build/curseforge/responses/
          if-no-files-found: ignore
          retention-days: 90

      - name: Record dry run
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: echo "Six release JARs verified. Dry run only; nothing uploaded to CurseForge." >> "$GITHUB_STEP_SUMMARY"
