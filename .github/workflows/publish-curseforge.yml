name: Publish CurseForge (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publishing-disabled:
    name: Dual-loader publisher not installed
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy single-loader publishing
        run: |
          echo "::error::CurseForge publishing is intentionally disabled. The retired workflow could upload only the Fabric JAR; implement and validate the dual-loader publisher before enabling uploads."
          exit 1
