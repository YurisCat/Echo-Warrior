plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev'
}

sourceSets {
	main {
		java {
			srcDirs = ['src/main/java', 'src/client/java']
		}
	}
}

// Artwork and translations have one source of truth. Only format-specific
// overrides live in this compatibility line.
def sharedResources = tasks.register('stageSharedResources', Sync) {
	def overrides = fileTree('src/main/resources')
	def overridePaths = overrides.files.collect {
		file('src/main/resources').toPath().relativize(it.toPath()).toString().replace('\\', '/')
	}
	from(rootProject.file('../../common/src/main/resources')) {
		exclude overridePaths
	}
	from(overrides)
	into(layout.buildDirectory.dir('generated/sharedResources'))
}
sourceSets.main.resources.setSrcDirs([sharedResources])

neoForge {
	neoFormVersion = neo_form_version
	interfaceInjectionData.from(rootProject.file('neoforge/src/main/interface-injections/geckolib.json'))
	validateAccessTransformers = true
}

dependencies {
	compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
	compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))
	compileOnly("net.tslat:smartbrainlib-fabric-${minecraft_version}:${smartbrainlib_version}")
	compileOnly("com.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}")
}
