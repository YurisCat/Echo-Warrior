plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

allprojects {
	version = project.mod_version
	group = project.maven_group

	if (project != rootProject) {
		repositories {
			maven {
				name = 'SmartBrainLib'
				url = 'https://dl.cloudsmith.io/public/tslat/sbl/maven/'
				content { includeGroup 'net.tslat' }
			}
			maven {
				name = 'GeckoLib'
				url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
				content { includeGroup 'com.geckolib' }
			}
		}
	}
}

tasks.register('fabricBuild') {
	group = 'build'
	description = 'Daily build: builds the Fabric package only.'
	dependsOn(':fabric:build')
}

tasks.register('dualBuild') {
	group = 'build'
	description = 'Explicit dual-loader build: builds Fabric and NeoForge packages.'
	dependsOn(':fabric:build', ':neoforge:build')
}

tasks.register('runClient') {
	group = 'application'
	description = 'Daily development client: starts Fabric only.'
	dependsOn(':fabric:runClient')
}

tasks.register('runNeoForgeClient') {
	group = 'application'
	description = 'Explicit NeoForge development client.'
	dependsOn(':neoforge:runClient')
}

tasks.register('clean') {
	group = 'build'
	dependsOn(':common:clean', ':fabric:clean', ':neoforge:clean')
}
