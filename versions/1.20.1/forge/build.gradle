plugins { id 'net.neoforged.moddev.legacyforge' }

legacyForge {
    enable {
        forgeVersion = "${minecraft_version}-${forge_version}"
        disableRecompilation = true
    }
    runs {
        client {
            client()
            gameDirectory = rootProject.file('run-forge')
            programArguments.add '--username=Echo1201Forge'
            def world = providers.gradleProperty('quickPlayWorldForge').orNull
            if (world) programArguments.addAll '--quickPlaySingleplayer', world
            if (providers.gradleProperty('autoPauseAfterQuickPlay').orNull == 'true') {
                jvmArguments.add '-Decho_warrior.auto_pause_after_quick_play=true'
            }
            if (providers.gradleProperty('pauseOnJoin').orNull == 'true') {
                jvmArguments.add '-Decho_warrior.pause_on_join=true'
            }
        }
        server {
            server()
            gameDirectory = rootProject.file('run-forge-server')
        }
    }
    mods { echo_warrior { sourceSet sourceSets.main } }
}

dependencies {
    modImplementation("net.tslat.smartbrainlib:SmartBrainLib-forge-${minecraft_version}:${smartbrainlib_version}")
    modImplementation("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    implementation('com.eliotlash.mclib:mclib:20')
    annotationProcessor('org.spongepowered:mixin:0.8.5:processor')
}

mixin {
    add sourceSets.main, 'echo_warrior_1201.refmap.json'
    config 'echo_warrior_1201.mixins.json'
}
tasks.named('jar', Jar) { manifest.attributes('MixinConfigs': 'echo_warrior_1201.mixins.json') }
