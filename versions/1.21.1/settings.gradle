pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForge'
			url = 'https://maven.neoforged.net/releases/'
		}
	}
}

rootProject.name = 'echo-warrior-1.21.1'

includeBuild('../../build-logic')
include('common')
include('fabric')
include('neoforge')
