<title>英灵召唤器测试清单</title>
<style>
:root{color-scheme:dark;--bg:#17151d;--panel:#24212c;--line:#494254;--gold:#d2b46c;--text:#eee8dc;--muted:#aaa3b1;--ok:#78bf8b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#332b39,var(--bg) 48%);color:var(--text);font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}
main{max-width:1040px;margin:auto;padding:32px 20px 80px}header{display:flex;gap:18px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;color:var(--gold);font-size:28px}p{color:var(--muted);margin:.4em 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button,.file{border:1px solid var(--line);background:#302b39;color:var(--text);padding:8px 12px;border-radius:6px;cursor:pointer}button:hover,.file:hover{border-color:var(--gold)}input[type=file]{display:none}
.progress{height:9px;background:#111;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:16px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#8f7440,var(--gold),var(--ok));transition:width .2s}
#summary{font-weight:700;color:var(--gold)}section{background:linear-gradient(145deg,var(--panel),#1d1a23);border:1px solid var(--line);border-radius:10px;margin:14px 0;padding:16px 18px;box-shadow:0 8px 24px #0005}
h2{font-size:18px;margin:0 0 8px;color:#e3cf9b}.item{display:flex;gap:10px;padding:7px 4px;border-top:1px solid #ffffff0c}.item:first-of-type{border-top:0}.item.done{color:#89838d;text-decoration:line-through}.item input{width:18px;height:18px;accent-color:var(--ok);flex:none;margin-top:2px}
textarea{width:100%;min-height:72px;margin-top:12px;background:#15131a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px;resize:vertical}small{color:var(--muted)}
</style></head><body><main>
<header><div><h1>英灵召唤器 · 开发测试清单</h1><p>勾选结果自动保存在当前浏览器。每个分区下方可记录故障、复现步骤或手感意见。</p></div><div class="toolbar"><button id="export">导出结果</button><label class="file">导入结果<input id="import" type="file" accept="application/json"></label><button id="clear">清空勾选</button></div></header>
<div id="summary"></div><div class="progress"><div class="bar" id="bar"></div></div><div id="sections"></div>
<script>
const groups={
"GUI 与物品交互":["手持召唤器普通右键打开 GUI；没有装入遗物时仍能正常打开","打开 GUI 后世界背景像原版物品栏一样变暗，GUI 与槽位坐标不偏移","玩家物品栏正常交互，只有召唤器所在槽位被锁定","遗物装入/取出会即时刷新全部区域并正确遣散英灵","0～4 个天赋从右向左显示，图标与悬浮信息对应","技能、天赋、模式、经验条、燃料条悬浮信息完整","空燃料槽显示燃料说明；有物品时仅显示物品悬浮框","鼠标拿起燃料或遗物左键物品栏中的召唤器会放入对应内部槽；冲突/无效物品不变化，普通物品不能进入模块槽","属性与燃料全部读取真实服务端数据"],
"遗物、天赋与成长":["创造栏遗物保持未鉴定，真正取入玩家物品栏后才初始化；/give同样只初始化一次","天赋数量权重、无重复及两组互斥规则正确","复制遗物保留天赋、成长、模式、技能与冷却","开发命令 /echo_warrior relic reroll_traits 可用","共同战斗经验不抢玩家经验球","30级曲线、60生命与12攻击终值正确","升级即时刷新实体属性并有声音/行动栏反馈"],
"燃料与召唤":["新召唤器为0/1000，腐肉+20、灵魂沙和灵魂土均+50","召唤器位于玩家物品栏且GUI未打开时每5tick最多转换一个","同一召唤器转化燃料时主副手不下沉抽动；真正切换物品或另一只召唤器时仍有换手动画","容量不足时不消耗，GUI转换粒子正确","燃料条宽度、遮罩与悬浮信息同步","召唤成本及天赋比例正确，创造模式同样扣除","安全位置搜索失败时不扣燃料","GUI召唤/单击立即收回后保持开启；召唤青蓝粒子只在按钮附近外散，收回蓝焰只在按钮附近内聚","潜行右键在未召唤时召唤、已召唤时召回；召回不扣燃料且英灵不会自然超时","脱战回血间隔和小数燃料累计正确"],
"模式与边界":["跟随模式跟随与超距传送正确","等待模式限于2格，被推离或战斗结束后能够完整寻路返回；主动扫描6格、8格放弃并可重设锚点","闲逛通常停留2～5秒后连续走完约4～8格，不会只迈一步便停止，也不会持续无间隔踱步","闲逛在坡地、台阶和障碍环境中只选择安全可达的陆地目标，失败或卡住后会重试；接近12～14格边缘时偏向锚点，越过16格后归位，战斗追击最多24格","闲逛可被战斗、主动技能、玩家互动和浮水打断；临时行为结束后短暂停留再继续，旧路径不会覆盖高优先级行为","三种英灵在跟随、闲逛、归位和游泳时主要看向前进方向，不会持续侧头或回头盯着主人；普通行走侧视约限于头部15°、瞳孔额外10°","行走中的战斗目标、苦力怕、伤害来源和快速接近目标仍能覆盖前进视线；停止移动后约0.3秒内自然恢复普通观察与玩家对视","主动、被动、和平三种警戒逻辑正确","普通挥刀只在判定帧处于原版近战范围且有视线时命中，拉开距离或隔墙不会隔空受伤","友军、队伍、驯服生物和创造/旁观玩家保护正确","三种英灵落入普通河流或深水后主动浮向水面，持续完全潜水不会受到溺水伤害","跟随模式下困在水下屋顶或封闭水坑时，约2秒后停止水下战斗并尝试游向主人，约5秒无有效位移后安全传送到主人附近","等待与闲逛模式不会被水域逻辑强制召回；追猎、举盾冲锋和军团永存不会被水下脱困传送中途打断"],
"士兵阵列":["技能启用后始终生效，不需要敌人，可在GUI技能栏手动关闭；技能框始终保持普通白边","未持盾时显示无限持续的‘举起武器！’及独立图标，固定提供不叠加+2攻击","离开8格范围、禁用技能、来源消失或重新登录时直接取消效果，旧版无限效果也会被清理","主人任一只手持盾时立即切换为‘举起盾牌！’及独立图标，攻击仍只加2，同时双方获得15%最终减伤","移走盾牌后立即切回‘举起武器！’，两个状态不同时残留；举盾冲锋充能数字已向下1像素"],
"举盾冲锋":["3点初始充能及每5秒世界时间恢复正确","只拦截约1秒内威胁主人的敌对投射物/苦力怕","投射物反射保留伤害、改变归属且只处理一次","主人近期攻击的苦力怕被排除","苦力怕按70/30方向击退约5～7格且引信不重置","冲锋阻塞/超时取消，不沿途造成伤害","充能数字与顺时针像素遮罩正确","冲锋期间维持举盾，头部笔直朝前且瞳孔仍可小幅观察；结束后收盾","速度呈平稳起步、中段加速、末段收势","沿途有低频风弹声和少量尾流，命中两类目标都有盾牌撞击声","命中或取消后水平速度迅速衰减，不会继续顶着目标滑行","0.5秒冷却从冲锋结束时开始，同一目标2秒内不会再次触发"],
"军团永存":["触发条件、同主人互斥与20秒冷却正确","12格可见近远程敌人被嘲讽且头顶持续显示生气粒子","自身头顶零星生气粒子沿小型抛物线上升再回落，脚底无触发风爆","触发后通过同步姿态维持举盾动作，头部不被上半身旋转带歪，瞳孔可独立观察","5秒定身、+12护甲、100%击退抗性正确","爆发完成后才收盾，释放使用风弹爆发音效","仅累计敌对实体造成的减免前伤害","6格每名敌人承受完整返还且仍受自身减伤","平方根极端击退和距离衰减手感合理","蓄力、释放及冷却遮罩反馈正确"],
"埃及弓箭手":["分别在拉弓早期、中期和满弓前杀死目标：先保持当前弓姿和动作相位6tick（约0.3秒）搜寻替代目标；有替代目标时保留进度转火，无替代目标时完成当前安全阶段再自然放弓，不跳到满弓、不永久满弓、不抽搐、不射空箭","连续射击至少20次：初次DRAWBOW→SHOOT后保持左手举起未拉开的弓；第二次起右手独立从箭袋取箭，左手和弓在箭搭弦前始终保持射后待命姿势，随后双臂直接进入满弓，不闪回首次DRAWBOW起始姿势。手持箭从箭袋到弓弦始终贴合右手，不脱手或错位；轮次之间不闪现待机或双手放下，弓和身体不发生单帧跳变","放箭后立即杀死最后一个目标：先停在举弓未拉开的待命姿势，再约0.5秒自然放下双手与弓；有其他目标时不播放收弓","10～20格且视线通畅时停止导航与残留移动输入，以站立射击为主，不小幅左右挪动或闪烁腿部动画","平坦开放地面上，威胁进入8格后保持面向主要目标，但实际位置由世界坐标速度持续沿直接远离方向增加距离，而不是相对朝向左右平移；退出10格后停止风筝","直后方有墙、悬崖、火焰、熔岩或细雪时才改用斜后/侧方安全路线；路线不按固定周期左右换向；一格实心方块立即触发普通后退跳跃并在腾空时继续后移，二格墙和危险落点不会被穿过","让普通敌人与宽碰撞箱蜘蛛分别在DRAWBOW、SHOOT、举弓待命、远程目标刚死亡或射击间隔边界贴身：备用近战立即取消远程与hurt动作，同时保持面向目标并继续后退求生；僵尸或蜘蛛直接命中后同一服务端tick抢占近战，不能站着持续挨打。等待/闲逛时，攻击者即使位于活动锚点边界外，只要仍能贴身命中也必须完成自卫近战但不向外追击。完整20tick近战只覆盖上半身，下半身按实际位移走路且动作不可打断；原目标在伤害帧前失效时可在不重播、不延时的前提下仅转移一次，伤害帧后不再转移；若仍复现，保存[EgyptianArcherMelee]日志","贴身求生撤退不受战车与齐射开关影响：以基础移速85%沿远离8格内全部有效近身威胁的加权方向移动，最近实际攻击者权重更高；直线受阻才尝试稳定斜后/侧方，能跳上一格台阶。最近威胁达到4格后恢复移动射击/普通风筝","分别测试单个低威胁敌人、6格内两名敌人、生命不高于40%、撤退受阻约0.5秒及近战中再次受击：后撤步不打断近战，近战结束后按威胁尝试；已撤到4格外或没有安全路径时不浪费充能","当前目标在8格外且远程敌人命中时紧急转火；8格内近身威胁仍优先","后撤步严格保持起跳朝向，完整碰撞箱不穿墙；无安全路径不消耗充能，中途受阻停在最后安全点","主动警戒及玩家先攻击龙体部件后的防御模式都能锁定末影龙，瞄准24格内最近可见部件并实际扣血","叶形箭黄色尾迹、锥锋箭黑色尾迹、普通箭无尾迹；齐射成功时身体周围出现金黄色粒子","赞美猫神提示完整写出苦力怕保护与亡灵额外20%伤害，流血不乘亡灵增伤","五个埃及弓箭手技能槽显示赞美猫神、叶形箭、锥锋箭、战车与齐射之魂、后撤步的正式人工图标；游戏GUI与网页百科一致","拥有与另外两名英灵一致的完整眼神神情系统；战斗时身体正面、头部和瞳孔逐tick注视当前射击对象。对同一目标连续射击至少20次并在轮次边界插入转火/击杀，头部不会被多轴父骨骼带成抬头、向右侧看或突然切回自然观察；其他视觉反应不能抢走注视。若仍复现，保存日志中的[EgyptianArcherGaze]与[EgyptianArcherGazeClient]行"],
"持久化与多人":["使用scripts/playtest-now.bat启动后，Minecraft窗口自动恢复并置于前台，不会在后台锁住鼠标","关闭GUI、换槽、重进后数据不丢失","实体加载后主人、模式与锚点正确","换遗物实例遣散旧英灵且不自动召唤","多个召唤器不会串绑、串燃料、串经验或串冷却","维齐洛波奇特利祝福在技能关闭、换遗物、英灵死亡/遣散、绑定失效及退出重进后立即清理","单人、局域网/专用服务器结果一致"]};
groups["埃及弓箭手"].push("连续射击至少20次并重点观察第二次及后续拔箭：箭骨骼应按原始Catmull-Rom曲线以48Hz烘焙，从箭袋到搭弦的中间帧都贴合右手；不能只在关键帧对齐、曲线中段却发生角度错位。");
groups["埃及弓箭手"].push("让幻翼分别停留在24格球形射程外、被方块遮挡以及俯冲进入24格且视线通畅的位置：前两种情况不得长期锁定、仰头跟随却不射击；满足实际射击条件后应重新锁定并正常放箭。");
groups["埃及弓箭手目标稳定性"]=["同时放置两名同优先级敌人并让它们在8格内交替略微靠近：各射击阶段不按距离来回转头；只有最近实际伤害来源或实际近战范围内的严格更高威胁可在DRAW阶段保留当前相位地抢占，身体、头和瞳孔未重新对准前不放箭。SHOOT锁定已提交目标直到释放完成；目标中途死亡则完成姿态但不射空箭，再从举弓待命索敌。若仍出现侧看，保存日志；[EgyptianArcherGazeClient]的worldError应代表最终Head、Eyes、Hat世界坐标计算出的持续视线误差，而不是局部父骨骼补偿跳变"];
groups["埃及弓箭手战后注视"]=["击杀最后一个敌人后继续观察至少3秒：目标短暂丢失的6tick内继续保持最后战斗注视；实体静止时日志应显示kind=post_combat、moving=false，不得因旧的20tick移动注视滞后切成locomotion。只有当前确实存在导航或水平位移时才接到行进方向；举弓待命、放弓、恢复及动作状态结束后的8tick动画混合尾帧始终使用同一套精确父骨骼逆变换。缓冲结束后的自然观察应平滑、较慢；若仍复现，保存日志中的[EgyptianArcherPostCombatGaze]行"];
groups["埃及弓箭手锚点外自卫"]=["在等待或闲逛模式下把弓箭手和敌人引到活动锚点边界外，再让敌人进入约4格或直接命中：同一目标贯穿近战、后撤步和落地后的重新瞄准，不出现selected仍为敌人但resolved=-1，也不被普通苦力怕警觉抢走头部；敌人在10格内时允许反击、后退和原地瞄准，失去视线后不向锚点外追击，退出10格后解除自卫并返回活动区域。若仍复现，保存[EgyptianArcherSelfDefense]、[EgyptianArcherGaze]与[EgyptianArcherPostCombatGaze]日志"];
const KEY="echo-warrior-summoner-checklist-v6";let state=JSON.parse(localStorage.getItem(KEY)||'{"checks":{},"notes":{}}');
const root=document.querySelector('#sections');let n=0;for(const [title,items] of Object.entries(groups)){const s=document.createElement('section');s.innerHTML=`<h2>${title}</h2>`;items.forEach(text=>{const id=`c${n++}`,row=document.createElement('label');row.className='item';row.innerHTML=`<input type="checkbox" data-id="${id}"><span>${text}</span>`;const box=row.querySelector('input');box.checked=!!state.checks[id];row.classList.toggle('done',box.checked);box.onchange=()=>{state.checks[id]=box.checked;row.classList.toggle('done',box.checked);save()};s.append(row)});const note=document.createElement('textarea');note.placeholder=`${title}：问题记录 / 复现步骤 / 手感意见`;note.value=state.notes[title]||'';note.oninput=()=>{state.notes[title]=note.value;save()};s.append(note);root.append(s)}
function save(){localStorage.setItem(KEY,JSON.stringify(state));update()}function update(){const boxes=[...document.querySelectorAll('input[type=checkbox]')],done=boxes.filter(x=>x.checked).length;document.querySelector('#summary').textContent=`已完成 ${done} / ${boxes.length} 项（${Math.round(done*100/boxes.length)}%）`;document.querySelector('#bar').style.width=`${done*100/boxes.length}%`}update();
document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='summoner-test-results.json';a.click();URL.revokeObjectURL(a.href)};
document.querySelector('#import').onchange=async e=>{try{state=JSON.parse(await e.target.files[0].text());localStorage.setItem(KEY,JSON.stringify(state));location.reload()}catch{alert('无法读取该测试结果文件。')}};
document.querySelector('#clear').onclick=()=>{if(confirm('确定清空所有勾选？问题记录会保留。')){state.checks={};save();location.reload()}};
</script></main></body></html>
